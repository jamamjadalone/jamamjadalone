<svg width="854" height="200" viewBox="0 0 854 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021c38" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>
    <!-- Card glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 34px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .badge-txt {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #34d399;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Base Solid Background Card -->
  <rect width="854" height="200" rx="14" fill="url(#bgGrad)" />
  <rect width="854" height="200" rx="14" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Ambient Decorative Glow Circles -->
  <circle cx="120" cy="40" r="140" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  <circle cx="750" cy="160" r="130" fill="#10b981" opacity="0.07" filter="url(#glow)" />

  <!-- Pre-rendered Elegant Geometric Waves (100% Solid & Static, No JS/Animate Dependency) -->
  <path d="M0 148 C 180 120, 360 175, 540 140 C 680 115, 780 150, 854 135 L 854 200 L 0 200 Z" fill="url(#waveGrad1)" />
  <path d="M0 162 C 200 135, 420 185, 620 155 C 720 140, 800 168, 854 158 L 854 200 L 0 200 Z" fill="url(#waveGrad2)" />

  <!-- Subtle Accent Line -->
  <rect x="0" y="0" width="854" height="3" fill="url(#accentGrad)" />

  <!-- Top Status Badge Pill -->
  <rect x="332" y="24" width="190" height="26" rx="13" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
  <circle cx="347" cy="37" r="4" fill="#10b981" />
  <text x="432" y="41" class="badge-txt" text-anchor="middle">SYSTEMS &amp; DEV SUITE</text>

  <!-- Main Headline Name -->
  <text x="427" y="96" class="title" text-anchor="middle">Muhammad Amjad Rasheed</text>

  <!-- Subtitle -->
  <text x="427" y="128" class="subtitle" text-anchor="middle">Full-Stack &amp; Systems Developer • Open-Source Engineer • Automation</text>

  <!-- Highlight Tagline -->
  <text x="427" y="158" class="tagline" text-anchor="middle">• Fast • Modular • Zero-Telemetry • 100% Offline-First Architecture</text>
</svg>
